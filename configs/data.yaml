# Data pipeline configuration. Paths are relative to the project root.
seed: 42

paths:
  raw_dir: data/raw
  snapshot_dir: data/snapshots

raw_files:
  transactions: train_transaction.csv
  identity: train_identity.csv

# TransactionDT is a seconds offset from an unknown reference. The usual
# community assumption is that 86,400 (the minimum) falls on 2017-12-01,
# which puts the reference at 2017-11-30. This is an assumption, not a fact.
reference_date: "2017-11-30"

# Time split boundaries (exclusive upper bounds). Calendar months under the
# reference date above: train Dec-Mar, validation Apr, test May (+ tail).
split:
  train_end: "2018-04-01"
  validation_end: "2018-05-01"

# Chargebacks arrive late. Features that use fraud labels may only count
# labels known at least this many days before the current transaction.
label_delay_days: 30
