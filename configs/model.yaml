# Model configuration. Models are fitted on the train split and compared on
# the validation split; the test split stays untouched until final evaluation.

evaluation:
  # Recall is reported at this false-positive rate (1% of genuine flagged).
  target_fpr: 0.01

# Hand-written rules a fraud team might start with: amount limits, velocity
# limits and blacklists. Score = sum of weights of the rules that fire.
rules:
  - name: high_amount
    feature: TransactionAmt
    op: ">"
    value: 1000
    weight: 1.0
  - name: card_burst_1h
    feature: vel_card_1h_cnt
    op: ">="
    value: 3
    weight: 1.0
  - name: card_burst_24h
    feature: vel_card_24h_cnt
    op: ">="
    value: 10
    weight: 1.0
  - name: new_card_high_amount
    feature: card_amt_new_high   # derived: new card and amount > 300
    op: ">="
    value: 1
    weight: 1.0
  - name: card_blacklisted
    feature: graph_card_known_fraud
    op: ">="
    value: 1
    weight: 2.0
  - name: device_blacklisted
    feature: graph_device_fraud_cards
    op: ">="
    value: 1
    weight: 1.5

logistic:
  C: 0.1
  max_iter: 2000
  # Categorical levels rarer than this share are grouped as "infrequent".
  min_category_share: 0.001
  # Columns the linear model uses. Raw Vesta (V*) and identity (id_*) columns
  # are left to the tree model; integer codes like card1 are not quantities.
  categorical: [ProductCD, card4, card6, P_emaildomain, R_emaildomain, DeviceType, M4, M6]
  exclude_prefixes: ["V", "id_"]
  exclude: [card1, card2, card3, card5, addr1, addr2, DeviceInfo]

lightgbm:
  # Optuna searches hyperparameters on time-ordered folds inside the training
  # months (expanding window: fit on earlier chunks, score the next chunk).
  n_trials: 60
  timeout_minutes: 60
  n_folds: 3
  early_stopping_rounds: 100
  max_rounds: 3000
  # String columns become LightGBM categoricals. Levels seen fewer times than
  # this in training are grouped as "other"; at most this many levels are kept.
  categorical_min_count: 30
  categorical_max_levels: 200
  exclude: []

calibration:
  # Isotonic regression maps raw scores to fraud probabilities. It is fitted on
  # the validation month; its quality is measured out-of-fold on time blocks.
  n_folds: 5
  # Reliability diagram and ECE bins, roughly log-spaced: most rows (and most
  # decisions) sit at small probabilities.
  bin_edges: [0.0, 0.001, 0.003, 0.01, 0.03, 0.1, 0.3, 0.6, 1.0]

decision:
  # Costs are assumptions, not merchant data (see the sensitivity analysis).
  # Approving fraud costs the transaction amount (the merchant pays the chargeback).
  false_decline_cost: 15.0   # genuine customer declined: lost margin plus churn risk
  review_cost: 3.0           # analyst time per case
  review_capacity_per_day: 200
  # Odds multipliers tried on top of the calibrated probability. 1.0 means
  # "trust the calibration"; the sweep checks whether that holds.
  risk_multipliers: {min: 0.125, max: 8.0, n: 25}
  # Cost assumptions are scaled by each factor for the sensitivity analysis.
  sensitivity_factors: [0.5, 1.0, 2.0]
