name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Lint, type-check and test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python and dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Tests (includes split and snapshot integrity tests)
        run: uv run pytest --cov=fraudguard --cov-report=term-missing

      - name: Pipeline smoke run on synthetic data
        run: |
          uv run fraudguard data synth --rows 5000
          uv run fraudguard all --trials 10
